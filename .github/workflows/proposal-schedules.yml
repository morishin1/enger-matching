# 提案の予約配信を定期実行する。
#   Vercel Hobby（無料）は cron が 1日1回しか動かないため、
#   GitHub Actions（無料枠）から本番エンドポイントを定期的に叩く（auto-ingest と同方式）。
#
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#   PROPOSAL_SCHEDULES_URL : https://<本番ドメイン>/api/cron/proposal-schedules
#   CRON_SECRET            : Vercel に設定したものと同じ値（auto-ingest と共通）
#
# 注意: スケジュール実行は「デフォルトブランチ（main 等）」に置かれている時だけ動く。
#       このファイルを main にマージして初めて定期実行が有効になる。
#       15分間隔のため、予約時刻から最大15分程度の遅延がある（GitHub 側の混雑でさらに
#       数分遅れることもある）。

name: proposal-schedules

on:
  schedule:
    - cron: "*/15 * * * *" # 15分ごと（予約配信の遅延を最大15分程度に抑える）
  workflow_dispatch: {} # 画面から手動実行も可能

concurrency:
  group: proposal-schedules
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger proposal-schedules endpoint
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROPOSAL_SCHEDULES_URL }}")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "proposal-schedules failed (HTTP $code)" >&2
            exit 1
          fi
